[tools]
pnpm = "11.28.0"
node = "24"

[tasks.install]
description = "Install root and web dependencies used by the test suite"
run = """
pnpm install --frozen-lockfile
pnpm --dir clients/web install --frozen-lockfile
"""

[tasks.test]
depends = ["install"]
description = "Run tests"
run = "pnpm test"

[tasks.build]
depends = ["install"]
description = "Build"
run = "pnpm run build"
