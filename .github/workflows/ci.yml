name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  root-tests:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:root-tests
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@2761920a2537112201681132b79d2e48fd41c36b # v4
    with:
      install: true
      working-directory: .
      lint: false
      test: true
      build: false

  web-build:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:web-build
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@2761920a2537112201681132b79d2e48fd41c36b # v4
    with:
      install: true
      working-directory: clients/web
      lint: false
      test: false
      build: true
